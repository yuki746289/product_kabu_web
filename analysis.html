    for(let i=start;i<start+span;i++){const th=document.createElement('th');th.textContent=COLUMNS[i];if(STARTS.has(i))th.className='group-start';th.onclick=()=>sortBy(i);head.appendChild(th);}
  });
}else{head.style.display='none';groupHead.className='table-single-row';}
function num(v){const n=Number(String(v).replace(/,/g,''));return Number.isFinite(n)?n:null;}
function sortBy(i){ if(sortCol===i)sortAsc=!sortAsc;else{sortCol=i;sortAsc=true;} filtered.sort((a,b)=>{let x=a[i],y=b[i],nx=num(x),ny=num(y);let r=(nx!==null&&ny!==null)?nx-ny:String(x).localeCompare(String(y),'ja');return sortAsc?r:-r;}); page=0; render();}
function applyFilter(){const s=q.value.trim().toLowerCase();filtered=s?DATA.filter(r=>r.some(v=>String(v).toLowerCase().includes(s))):DATA.slice();page=0;if(sortCol>=0){const i=sortCol,asc=sortAsc;filtered.sort((a,b)=>{let x=a[i],y=b[i],nx=num(x),ny=num(y);let r=(nx!==null&&ny!==null)?nx-ny:String(x).localeCompare(String(y),'ja');return asc?r:-r;});}render();}
function render(){const size=Number(ps.value), pages=Math.max(1,Math.ceil(filtered.length/size));if(page>=pages)page=pages-1;const start=page*size,end=Math.min(filtered.length,start+size);body.innerHTML='';for(const r of filtered.slice(start,end)){const tr=document.createElement('tr');r.forEach((v,i)=>{const td=document.createElement('td');td.textContent=v;if(STARTS.has(i))td.className='group-start';tr.appendChild(td);});body.appendChild(tr);}document.getElementById('summary').textContent=`${filtered.length.toLocaleString()}行中 ${filtered.length?start+1:0}〜${end}行`;document.getElementById('page').textContent=`${page+1} / ${pages}`;document.getElementById('prev').disabled=page<=0;document.getElementById('next').disabled=page>=pages-1;}
q.oninput=applyFilter; ps.onchange=()=>{page=0;render();};document.getElementById('prev').onclick=()=>{page--;render();};document.getElementById('next').onclick=()=>{page++;render();};render();
</script><script>document.documentElement.dataset.p2Page="analysis";</script><script src="_runtime/p2_page_runtime.js" defer></script></body></html>
