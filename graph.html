    const bw=Math.max(4,Math.min(18,g.step*.62));ctx.fillStyle='#2457a6';
    rows.forEach((r,i)=>{const xx=x(i)-bw/2,yy=yCount(r.entries);ctx.fillRect(xx,yy,bw,g.top+plotH-yy)});
  }else{
    ctx.strokeStyle='#2457a6';ctx.lineWidth=2;ctx.beginPath();rows.forEach((r,i)=>{const xx=x(i),yy=yCount(r.entries);if(i===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy)});ctx.stroke();
  }
  ctx.strokeStyle='#b45309';ctx.lineWidth=2.2;ctx.beginPath();let started=false;currentPoints=[];
  rows.forEach((r,i)=>{const v=mode==='cumulative'?r.cumulative:r.monthly;currentPoints.push(v);if(v==null)return;const xx=x(i),yy=yRate(v);if(!started){ctx.moveTo(xx,yy);started=true}else ctx.lineTo(xx,yy)});
  ctx.stroke();
  ctx.fillStyle='#b45309';rows.forEach((r,i)=>{const v=currentPoints[i];if(v==null)return;ctx.beginPath();ctx.arc(x(i),yRate(v),2.5,0,Math.PI*2);ctx.fill()});

  const labelEvery=Math.max(1,Math.ceil(rows.length/14));ctx.fillStyle='#667085';ctx.textAlign='center';ctx.font='11px sans-serif';
  rows.forEach((r,i)=>{if(i%labelEvery===0||i===rows.length-1){ctx.save();ctx.translate(x(i),g.top+plotH+18);ctx.rotate(-.55);ctx.fillText(r.month,0,0);ctx.restore()}});
  ctx.textAlign='left';
  const sum=rows.reduce((a,r)=>a+Number(r.entries||0),0);document.getElementById('sumEntries').textContent=sum.toLocaleString()+'本';
  let last=null;for(let i=rows.length-1;i>=0;i--){if(currentPoints[i]!=null){last={r:rows[i],v:currentPoints[i]};break}}
  if(last){const w=mode==='cumulative'?last.r.cumWins:last.r.w,e=mode==='cumulative'?last.r.cumEval:last.r.e;document.getElementById('rateSummary').textContent=rateText(last.v,w,e)}
  else document.getElementById('rateSummary').textContent='-';
  document.getElementById('baseSummary').textContent=horizon.value+'D / '+(mode==='cumulative'?baseMonth.value:'単月');
  baseMonth.disabled=mode!=='cumulative';
}
function showTip(ev){
  if(!geom||!currentRows.length)return;const rect=canvas.getBoundingClientRect(),mx=ev.clientX-rect.left;const i=Math.max(0,Math.min(currentRows.length-1,Math.floor((mx-geom.left)/geom.step)));const r=currentRows[i],v=currentPoints[i];if(!r)return;
  const mode=winMode.value,w=mode==='cumulative'?r.cumWins:r.w,e=mode==='cumulative'?r.cumEval:r.e;
  tip.innerHTML='<strong>'+r.month+'</strong><br>エントリ本数: '+r.entries+'本<br>'+(mode==='cumulative'?'累積勝率: ':'単月勝率: ')+rateText(v,w,e)+'<br>評価期間: '+horizon.value+'D';
  tip.style.display='block';tip.style.left=Math.min(canvas.width-180,ev.offsetX+12)+'px';tip.style.top=Math.max(8,ev.offsetY-20)+'px';
}
canvas.addEventListener('mousemove',showTip);canvas.addEventListener('mouseleave',()=>tip.style.display='none');
for(const el of [entryStyle,winMode,horizon,displayRange,baseMonth])el.addEventListener('change',draw);
window.addEventListener('resize',draw);draw();
</script><script>document.documentElement.dataset.p2Page="graph";</script><script src="_runtime/p2_page_runtime.js" defer></script></body></html>
