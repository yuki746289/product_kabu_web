<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>グラフ読込中</title></head>
<body><p id="graph-loading">グラフを読み込んでいます。</p>
<script>
(async function () {
  "use strict";
  const query = new URLSearchParams(window.location.search);
  const dataset = query.get("dataset") || "02_nikkei_225_all";
  const subject = query.get("subject") || "s-0c5d25b829768750";
  if (dataset !== "02_nikkei_225_all" || !/^[hpst]-[0-9a-f]{16}$/.test(subject)) {
    throw new Error("許可されていないグラフ指定です。");
  }
  const response = await fetch(`data/datasets/${dataset}/graphs/${subject}.json`, {cache: "no-store"});
  if (!response.ok) {
    throw new Error(`グラフデータを取得できません: ${response.status}`);
  }
  const payload = await response.json();
  const valid = payload.pageType === "graph"
    && payload.dataset === dataset
    && payload.subject === subject
    && payload.templateVersion === "release.3.0.0"
    && typeof payload.html === "string";
  if (!valid) {
    throw new Error("グラフデータが不正です。");
  }
  document.open();
  document.write(payload.html);
  document.close();
})().catch((error) => {
  const message = document.getElementById("graph-loading");
  message.textContent = `グラフを表示できません: ${error.message}`;
  document.documentElement.dataset.p2RuntimeError = "true";
});
</script></body></html>
